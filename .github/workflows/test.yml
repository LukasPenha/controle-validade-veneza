name: Testes e recuperação
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: veneza_source
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/veneza_source?sslmode=disable
      SECRET_KEY: ci-isolated-key-not-for-production-use
      RESTORE_TEST_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/veneza_restore?sslmode=disable
      BACKUP_PASSPHRASE: ci-only-backup-test-passphrase-not-for-production
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/postgres_check.py
      - run: python tools/backup.py --output backups/ci-test.gpg
