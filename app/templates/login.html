{% extends 'auth_base.html' %}{% block title %}Entrar · Veneza{% endblock %}
{% block form %}<span class="eyebrow mb-2">BEM-VINDO DE VOLTA</span><h2>Acesse sua operação</h2><p class="text-muted small mb-4">Entre com os dados da sua conta.</p><form method="POST" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username" class="form-label">Usuário ou e-mail</label><input id="username" name="username" type="text" autocomplete="username" class="form-control mb-3" required><label for="password" class="form-label">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" class="form-control mb-3" required><div class="text-end mb-4"><a class="small" href="{{ url_for('auth.forgot_password') }}">Esqueci minha senha</a></div><button class="btn btn-primary w-100" type="submit">Entrar no sistema →</button></form>{% endblock %}
