{% extends 'base.html' %}
{% block title %}Relatórios Gerais{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Gerar Relatório Geral</h1>
</div>

<div class="card">
    <div class="card-header">
        Filtros do Relatório
    </div>
    <div class="card-body">
        <p class="text-muted">Preencha um dos dois blocos abaixo para gerar seu relatório: por data ou por item específico.</p>
        <form method="GET" action="{{ url_for('routes.gerar_relatorio_pdf') }}" target="_blank">
            
            <h5 class="mt-3">Filtro por Data</h5>
            <hr>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Início</label>
                    <input type="date" name="data_inicio" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Fim</label>
                    <input type="date" name="data_fim" class="form-control">
                </div>
            </div>

            <h5 class="mt-3">Filtro por Item</h5>
            <hr>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Nome do Produto, PLU ou Código de Barras</label>
                    <input type="text" name="search_term" class="form-control" placeholder="Ex: Coca Cola, 12345 ou 7894900010015">
                </div>
            </div>
            
            <h5 class="mt-3">Filtro Adicional</h5>
            <hr>
            <div class="row">
                 <div class="col-md-12 mb-3">
                    <label class="form-label">Filtrar por Loja (Opcional)</label>
                    <select name="loja_id" class="form-select">
                        <option value="todas">Todas as Lojas</option>
                        {% for loja in lojas %}<option value="{{ loja.id }}">{{ loja.nome }}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 mt-2"><i class="bi bi-file-earmark-pdf-fill"></i> Gerar Relatório</button>
        </form>
    </div>
</div>
{% endblock %}
